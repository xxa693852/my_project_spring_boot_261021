<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 我的報名</title>
    <link rel="stylesheet" href="/site.css?v=centered-cancel">
    <script src="/auth.js?v=2.5" defer></script>
    <script src="/line-notification-prompt.js?v=2.5.1" defer></script>
    <script src="/cancel-registration-dialog.js?v=centered-cancel" defer></script>
    <script src="/my-registrations.js?v=centered-cancel" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-bar">
            <a class="site-brand" href="/events.html">D&amp;D 活動報名</a>
            <nav id="member-nav" aria-label="會員"></nav>
        </div>
    </header>
    <main class="page">
        <h1>我的報名</h1>
        <p id="line-notification-prompt" class="notification-prompt" data-load-notification-status hidden><a href="/member-settings.html#line-notification-form">綁定 LINE 接收開團提醒與取消通知</a></p>

        <button id="retry" type="button" hidden>重新載入</button>
        <p id="action-message" role="status" aria-live="polite"></p>
        <div id="registration-list"></div>
    </main>
