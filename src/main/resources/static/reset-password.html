<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>D&amp;D 重設密碼</title>
    <link rel="stylesheet" href="/site.css">
    <!-- 調整：先載入共用密碼檢查，再執行表單程式。 -->
    <script src="/password-rules.js?v=20261110" defer></script>
    <script src="/reset-password.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-bar">
            <a class="site-brand" href="/events.html">D&amp;D 活動報名</a>
        </div>
    </header>
    <main class="page page-narrow">
        <a href="/login.html">返回登入頁</a>
        <h1>重設密碼</h1>
        <p>請設定 15 至 72 個字元，且 UTF-8 不超過 72 bytes的新密碼。</p>
        <form id="reset-form">
            <label for="password">新密碼</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="72" required>
            <label for="confirmPassword">確認新密碼</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="15" maxlength="72" required>
            <button id="submit" type="submit">重設密碼</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <p id="success-link" hidden><a href="/login.html">前往登入</a></p>
    </main>
</body>
</html>
