<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>D&amp;D 重設密碼</title>
    <style>
        body { max-width: 480px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; border-radius: 8px; padding: 24px; }
        label { display: block; margin: 16px 0 6px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
        button { margin-top: 20px; padding: 10px 24px; font: inherit; cursor: pointer; }
        #message { min-height: 1.5em; overflow-wrap: anywhere; }
    </style>
    <!-- 調整：先載入共用密碼檢查，再執行表單程式。 -->
    <script src="/password-rules.js?v=20261110" defer></script>
    <script src="/reset-password.js" defer></script>
</head>
<body>
    <a href="/login.html">返回登入頁</a>
    <h1>重設密碼</h1>
    <p>請設定 15 至 72 個字元，且 UTF-8 不超過 72 bytes的新密碼。</p>
    <form id="reset-form">
        <label for="password">新密碼</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="72" required>
        <label for="confirmPassword">確認新密碼</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="15" maxlength="72" required>
        <button id="submit" type="submit">重設密碼</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p id="success-link" hidden><a href="/login.html">前往登入</a></p>
</body>
</html>
