<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 忘記密碼</title>
    <style>
        body { max-width: 480px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; border-radius: 8px; padding: 24px; }
        label { display: block; margin: 16px 0 6px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
        button { margin-top: 20px; padding: 10px 24px; font: inherit; cursor: pointer; }
        #message { min-height: 1.5em; overflow-wrap: anywhere; }
    </style>
    <script src="/forgot-password.js" defer></script>
</head>
<body>
    <a href="/login.html">返回登入頁</a>
    <h1>忘記密碼</h1>
    <p>輸入註冊時使用的 Email，我們會寄送密碼重設連結。</p>
    <form id="forgot-form">
        <label for="email">Email</label>
        <!-- Email 上限與 Request 及會員資料表一致。 -->
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button id="submit" type="submit">寄送重設連結</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p>若未收到信件，請檢查垃圾郵件匣，並確認輸入的是註冊信箱。</p>
</body>
</html>
