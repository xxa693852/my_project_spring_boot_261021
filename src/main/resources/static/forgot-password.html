<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 忘記密碼</title>
    <link rel="stylesheet" href="/site.css">
    <script src="/forgot-password.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-bar">
            <a class="site-brand" href="/events.html">D&amp;D 活動報名</a>
        </div>
    </header>
    <main class="page page-narrow">
        <a href="/login.html">返回登入頁</a>
        <h1>忘記密碼</h1>
        <p>輸入註冊時使用的 Email，我們會寄送密碼重設連結。</p>
        <form id="forgot-form">
            <label for="email">Email</label>
            <!-- Email 上限與 Request 及會員資料表一致。 -->
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
            <button id="submit" type="submit">寄送重設連結</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <p>若未收到信件，請檢查垃圾郵件匣，並確認輸入的是註冊信箱。</p>
    </main>
</body>
</html>
