<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 會員登入</title>
    <link rel="stylesheet" href="/site.css?v=2.5">
    <!-- 調整：先載入共用密碼檢查，再執行表單程式。 -->
    <script src="/password-rules.js?v=20261110" defer></script>
    <script src="/auth.js?v=member-admin" defer></script>
    <script src="/login.js?v=20261112" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-bar">
            <a class="site-brand" href="/events.html">D&amp;D 活動報名</a>
        </div>
    </header>
    <main class="page page-narrow">
        <a class="back-link" href="/events.html">← 返回活動列表</a>
        <h1>會員登入</h1>
        <form id="login-form">
            <label for="account">帳號</label>
            <input id="account" name="account" autocomplete="username" required autofocus>
            <label for="password">密碼</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <label class="checkbox-row">
                <input name="remember" type="checkbox">
                在這個瀏覽器保持登入
            </label>
            <button id="submit" type="submit">登入</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>
        <!-- 忘記密碼：未登入也能申請重設連結。 -->
        <p><a href="/forgot-password.html">忘記密碼？</a></p>
        <p>還沒有帳號？<a id="register-link" href="/register.html">建立帳號</a></p>
    </main>
</body>
</html>
