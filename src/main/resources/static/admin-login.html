<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 管理員登入</title>
    <link rel="stylesheet" href="/site.css?v=batch4-1">
    <script src="/site-time.js?v=batch4-1" defer></script>
    <script src="/admin-auth.js?v=refund-report-1" defer></script>
    <script src="/admin-login.js?v=1" defer></script>
</head>
<body>
    <header class="site-header"><div class="site-bar"><a class="site-brand" href="/events.html">D&amp;D 活動報名</a></div></header>
    <main class="page page-narrow">
        <a class="back-link" href="/events.html">← 返回活動列表</a>
        <h1>管理員登入</h1>
        <p>僅限管理員。閒置 30 分鐘會自動登出，後台不提供長期保持登入。</p>
        <form id="admin-login-form">
            <label for="account">管理員帳號</label>
            <input id="account" name="account" autocomplete="username" required autofocus>
            <label for="password">密碼</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="submit" type="submit">登入管理後台</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>
        <p><a href="/login.html">前往會員登入</a></p>
    </main>
</body>
</html>
