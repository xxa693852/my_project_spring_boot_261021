<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 活動詳情</title>
    <link rel="stylesheet" href="/site.css?v=centered-cancel">
    <script src="/auth.js?v=2.5" defer></script>
    <script src="/event-presentation.js?v=registration-conflict" defer></script>
    <script src="/line-notification-prompt.js?v=2.5.1" defer></script>
    <script src="/cancel-registration-dialog.js?v=centered-cancel" defer></script>
    <script src="/event-detail.js?v=registration-conflict" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-bar">
            <a class="site-brand" href="/events.html">D&amp;D 活動報名</a>
            <nav id="member-nav" aria-label="會員"></nav>
        </div>
    </header>
    <main class="page">
        <a class="back-link" href="/events.html">← 返回活動列表</a>
        <p id="message" role="status">活動載入中……</p>
        <div id="event-panel" class="event-detail-panel" hidden>
            <article id="event-detail">
                <img id="event-cover" class="event-cover" alt="">
                <div class="event-summary">
                    <p id="event-labels" class="event-labels"></p>
                    <h1 id="event-title"></h1>
                    <dl id="event-facts" class="event-facts"></dl>
                </div>
            </article>
            <section id="registration" aria-label="活動報名" hidden>
                <p id="registration-status"></p>
                <div class="actions">
                    <a id="login-link" class="button-link" hidden>登入後報名</a>
                    <button id="register-button" type="button" hidden>報名活動</button>
                    <button id="cancel-button" type="button" hidden>取消報名</button>
                </div>
                <div id="action-message" role="status" aria-live="polite"></div>
                <p id="line-notification-prompt" class="notification-prompt" hidden><a href="/member-settings.html#line-notification-form">綁定 LINE 接收開團提醒與取消通知</a></p>
            </section>
            <section class="event-description" aria-labelledby="description-heading">
                <h2 id="description-heading">活動介紹</h2>
                <p id="description" class="description"></p>
            </section>
        </div>
    </main>
</body>
</html>
