<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 活動詳情</title>
    <link rel="stylesheet" href="/site.css?v=centered-cancel">
    <script src="/auth.js?v=member-admin" defer></script>
    <script src="/event-presentation.js?v=registration-conflict" defer></script>
    <script src="/line-notification-prompt.js?v=2.5.1" defer></script>
    <script src="/cancel-registration-dialog.js?v=centered-cancel" defer></script>
    <link rel="stylesheet" href="/event-comments.css?v=4">
    <script src="/page-jump.js?v=1" defer></script>
    <script src="/event-comments.js?v=page-jump" defer></script>
    <script src="/event-fee.js?v=1" defer></script>
    <script src="/event-detail.js?v=payment-1" defer></script>
    <link rel="stylesheet" href="/page-jump.css?v=1">
</head>
<body>
    <header class="site-header">
        <div class="site-bar">
            <a class="site-brand" href="/events.html">D&amp;D 活動報名</a>
            <nav id="member-nav" aria-label="會員"></nav>
        </div>
    </header>
    <main class="page">
        <a class="back-link" href="/events.html">← 返回活動列表</a>
        <p id="message" role="status">活動載入中……</p>
        <div id="event-panel" class="event-detail-panel" hidden>
            <article id="event-detail">
                <img id="event-cover" class="event-cover" alt="">
                <div class="event-summary">
                    <p id="event-labels" class="event-labels"></p>
                    <h1 id="event-title"></h1>
                    <dl id="event-facts" class="event-facts"></dl>
                </div>
            </article>
            <p id="registration-fee" hidden></p>
            <section id="registration" aria-label="活動報名" hidden>
                <p id="registration-status"></p>
                <div class="actions">
                    <a id="login-link" class="button-link" hidden>登入後報名</a>
                    <button id="register-button" type="button" hidden>報名活動</button>
                    <button id="cancel-button" type="button" hidden>取消報名</button>
                </div>
                <div id="action-message" role="status" aria-live="polite"></div>
                <p id="line-notification-prompt" class="notification-prompt" hidden><a href="/member-settings.html#line-notification-form">綁定 LINE 接收開團提醒與取消通知</a></p>
            </section>
            <section class="event-description" aria-labelledby="description-heading">
                <h2 id="description-heading">活動介紹</h2>
                <p id="description" class="description"></p>
            </section>
            <section class="event-comments" aria-labelledby="comments-heading" hidden>
                <h2 id="comments-heading">活動留言</h2>
                <p id="comment-access" hidden></p>
                <a id="comment-login" hidden>登入後留言</a>
                <form id="comment-form" hidden>
                    <label for="comment-body">留言內容</label>
                    <textarea id="comment-body" rows="3" required maxlength="500"
                              aria-describedby="comment-limit"></textarea>
                    <p id="comment-limit">最多 500 字</p>
                    <button type="submit">送出留言</button>
                </form>
                <p id="comment-message" role="status"></p>
                <div id="comment-list"></div>
                <nav id="comment-pages" class="actions" aria-label="留言分頁" hidden>
                    <button id="comment-previous" type="button">上一頁</button>
                    <span id="comment-page-number"></span>
                    <span class="page-numbers"></span>
                    <button id="comment-next" type="button">下一頁</button>
                    <form class="page-jump"><label for="comment-jump-page">跳到第</label>
                        <input id="comment-jump-page" type="number" min="1" step="1" required>
                        <button type="submit">前往</button>
                    </form>
                </nav>
            </section>
        </div>
    </main>
    <dialog id="payment-confirmation" class="cancel-registration-dialog" aria-labelledby="payment-title">
        <form method="dialog">
            <h2 id="payment-title">確認付費報名</h2>
            <p id="payment-confirmation-fee"></p>
            <p>名額最多保留 30 分鐘，若報名先截止，保留也會提早結束。重開付款頁會沿用原期限。</p>
            <button value="back" autofocus>返回</button>
            <button value="pay">前往藍新測試付款</button>
        </form>
    </dialog>
    <dialog id="delete-comment-dialog" class="cancel-registration-dialog" aria-labelledby="delete-comment-title">
        <form method="dialog">
            <h2 id="delete-comment-title">刪除留言</h2>
            <p>確定要刪除這則留言嗎？刪除後無法復原。</p>
            <div class="actions">
                <button type="submit" value="keep" autofocus>保留留言</button>
                <button type="submit" value="cancel">確認刪除</button>
            </div>
        </form>
    </dialog>
</body>
</html>
