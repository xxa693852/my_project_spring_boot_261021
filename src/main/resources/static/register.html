<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D&amp;D 會員註冊</title>
    <link rel="stylesheet" href="/site.css?v=batch4-1">
    <!-- 調整：先載入共用密碼檢查，再執行表單程式。 -->
    <script src="/site-time.js?v=batch4-1" defer></script>
    <script src="/password-rules.js?v=batch2-1" defer></script>
    <script src="/member-rules.js?v=member-fields-1" defer></script>
    <script src="/admin-auth.js?v=admin-free-registration-1" defer></script>
    <script src="/auth.js?v=admin-member-bridge-1" defer></script>
    <script src="/register.js?v=member-fields-1" defer></script>
    <script src="/field-counters.js?v=batch3-1" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-bar">
            <a class="site-brand" href="/events.html">D&amp;D 活動報名</a>
        </div>
    </header>
    <main class="page page-narrow">
        <a id="login-link" href="/login.html">← 返回登入</a>
        <h1>會員註冊</h1>
        <form id="register-form" novalidate>
            <label for="name">姓名或暱稱（1～30 字元）</label>
            <input id="name" data-char-limit="30" name="name" autocomplete="name" maxlength="30" required aria-describedby="name-error">
            <p id="name-error" class="field-error"></p>
            <label for="account">帳號（4～20 字元）</label>
            <p id="account-help" class="field-help">可使用英文字母、數字、底線（_）、連字號（-）與半形句點（.），不可有空白。</p>
            <input id="account" data-char-limit="20" name="account" autocomplete="username" minlength="4" maxlength="20" pattern="[A-Za-z0-9_.\-]+" required aria-describedby="account-help account-error">
            <p id="account-error" class="field-error"></p>
            <!-- 調整確認：Email maxlength=254 與後端及資料庫一致。 -->
            <label for="email">電子信箱</label>
            <p id="email-help" class="field-help">請填寫可收信的電子郵件地址，例如 name@example.com。</p>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="email-help email-error">
            <p id="email-error" class="field-error"></p>
            <label for="password">密碼（15～30 字元）</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="30" required aria-describedby="password-error">
            <p id="password-error" class="field-error"></p>
            <label for="confirmPassword">確認密碼（請再次輸入相同密碼）</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="confirmPassword-error">
            <p id="confirmPassword-error" class="field-error"></p>
            <button id="submit" type="submit">註冊</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>
        <p id="success" role="status" hidden>註冊成功，請登入後繼續原本的操作。
            <a id="continue-login" href="/login.html">前往登入</a>
        </p>
    </main>
</body>
</html>
