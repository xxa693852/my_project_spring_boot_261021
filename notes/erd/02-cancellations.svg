<text x="40" y="48" font-size="29" font-weight="700" fill="#173d32">02　管理員個別取消報名與通知</text>
<text x="40" y="80" font-size="16" fill="#52635d">member_id 是被取消報名的會員；operator_id 是執行取消的管理員，兩者都對應 members。</text>
